version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: pulseroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulseroute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pulseroute-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: pulseroute-backend
    depends_on:
      - postgres
      - redis
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data: